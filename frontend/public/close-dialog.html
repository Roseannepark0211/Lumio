<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Lumio Close</title>
<style>
:root {
  --accent: #0a84ff;
  --danger: #ff453a;
  --font-display: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-body: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}
:root {
  --bg: rgba(20, 20, 30, 0.88);
  --border: rgba(255, 255, 255, 0.14);
  --text-primary: rgba(255, 255, 255, 0.96);
  --text-mute: rgba(235, 235, 245, 0.6);
  --btn-bg: rgba(255, 255, 255, 0.08);
  --btn-bg-hi: rgba(255, 255, 255, 0.14);
  --inset-hi: rgba(255, 255, 255, 0.15);
}
:root.light {
  --bg: rgba(255, 255, 255, 0.94);
  --border: rgba(0, 0, 0, 0.1);
  --text-primary: rgba(0, 0, 0, 0.92);
  --text-mute: rgba(0, 0, 0, 0.6);
  --btn-bg: rgba(0, 0, 0, 0.04);
  --btn-bg-hi: rgba(0, 0, 0, 0.08);
  --inset-hi: rgba(255, 255, 255, 0.6);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: transparent;
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  user-select: none;
}
.dialog {
  width: 360px;
  background: var(--bg);
  backdrop-filter: blur(40px) saturate(180%);
  -webkit-backdrop-filter: blur(40px) saturate(180%);
  border: 1px solid var(--border);
  border-radius: 24px;
  box-shadow:
    0 1px 0 var(--inset-hi) inset,
    0 30px 80px -20px rgba(0,0,0,0.7),
    0 8px 24px -8px rgba(0,0,0,0.5);
  padding: 28px;
  animation: dlgIn 0.2s var(--ease-out);
}
@keyframes dlgIn {
  from { opacity: 0; transform: scale(0.96); }
  to   { opacity: 1; transform: scale(1);    }
}
.dialog::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--inset-hi) 50%, transparent);
  pointer-events: none;
  border-radius: 24px 24px 0 0;
}
.title {
  font-family: var(--font-display);
  font-size: 19px;
  font-weight: 700;
  margin-bottom: 6px;
}
.text {
  font-size: 12px;
  color: var(--text-mute);
  margin-bottom: 14px;
  line-height: 1.5;
}
/* 记住选择勾选框 */
.remember {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 18px;
  font-size: 11px;
  color: var(--text-mute);
  cursor: pointer;
  user-select: none;
}
.remember input[type="checkbox"] {
  appearance: none;
  width: 16px;
  height: 16px;
  border: 1.5px solid var(--border);
  border-radius: 4px;
  background: transparent;
  cursor: pointer;
  position: relative;
  flex-shrink: 0;
}
.remember input[type="checkbox"]:checked {
  background: var(--accent);
  border-color: var(--accent);
}
.remember input[type="checkbox"]:checked::after {
  content: '';
  position: absolute;
  top: 1px;
  left: 4px;
  width: 5px;
  height: 9px;
  border: solid white;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}
.actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}
.btn {
  min-width: 88px;
  padding: 8px 16px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--btn-bg);
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s var(--ease), border-color 0.15s var(--ease);
}
.btn:hover {
  background: var(--btn-bg-hi);
}
.btn-primary {
  background: linear-gradient(180deg, var(--accent) 0%, #006edc 100%);
  border-color: var(--accent);
  color: white;
  box-shadow: 0 1px 0 rgba(255,255,255,0.2) inset;
}
.btn-primary:hover {
  background: linear-gradient(180deg, #0a94ff 0%, #0076ec 100%);
}
.btn-danger {
  color: var(--danger);
  border-color: rgba(255, 69, 58, 0.3);
}
.btn-danger:hover {
  background: rgba(255, 69, 58, 0.12);
}
</style>
</head>
<body>
<div class="dialog" id="dlg">
  <div class="title" id="title">关闭 Lumio？</div>
  <div class="text" id="text">主窗口将关闭，但下载任务会继续在后台进行。可选择最小化到托盘或完全退出程序。</div>
  <label class="remember">
    <input type="checkbox" id="remember" />
    <span id="remember-label">记住我的选择</span>
  </label>
  <div class="actions">
    <button class="btn" id="btn-cancel">取消</button>
    <button class="btn btn-danger" id="btn-quit">退出程序</button>
    <button class="btn btn-primary" id="btn-tray">最小化到托盘</button>
  </div>
</div>
<script>
(function () {
  var LUMIO = window.lumio || {};
  var TRAY = LUMIO.tray || {};
  var BASE = LUMIO.fastapiBase || '';
  var TOKEN = LUMIO.fastapiToken || '';

  var lang = 'zh';
  var STR = {
    zh: {
      title: '关闭 Lumio？',
      text: '主窗口将关闭，但下载任务会继续在后台进行。可选择最小化到托盘或完全退出程序。',
      cancel: '取消', quit: '退出程序', tray: '最小化到托盘',
      remember: '记住我的选择',
    },
    en: {
      title: 'Close Lumio?',
      text: 'The main window will close, but downloads continue in the background. Choose to minimize to tray or fully quit.',
      cancel: 'Cancel', quit: 'Quit', tray: 'Minimize to Tray',
      remember: 'Remember my choice',
    }
  };

  function applyLang() {
    var s = STR[lang] || STR.zh;
    document.getElementById('title').textContent = s.title;
    document.getElementById('text').textContent = s.text;
    document.getElementById('btn-cancel').textContent = s.cancel;
    document.getElementById('btn-quit').textContent = s.quit;
    document.getElementById('btn-tray').textContent = s.tray;
    document.getElementById('remember-label').textContent = s.remember;
  }

  // 读取主题 + 语言（不读 close_behavior，每次都弹，由用户勾选决定）
  fetch(BASE + '/api/config', {
    headers: TOKEN ? { 'X-Lumio-Token': TOKEN } : {}
  })
    .then(function (r) { return r.json(); })
    .then(function (cfg) {
      if (cfg.theme === 'light') document.documentElement.classList.add('light');
      lang = cfg.lang === 'en' ? 'en' : 'zh';
      applyLang();
    })
    .catch(function () {});

  // 勾选「记住选择」后，把对应行为写入 config.close_behavior
  function saveBehavior(behavior) {
    var chk = document.getElementById('remember');
    if (!chk || !chk.checked) return Promise.resolve();
    return fetch(BASE + '/api/config/close_behavior', {
      method: 'PUT',
      headers: TOKEN ? { 'X-Lumio-Token': TOKEN, 'Content-Type': 'application/json' }
                       : { 'Content-Type': 'application/json' },
      body: JSON.stringify({ value: behavior })
    }).catch(function () {});
  }

  document.getElementById('btn-cancel').onclick = function () {
    // 取消不写入 close_behavior
    if (TRAY.cancelClose) TRAY.cancelClose();
  };
  document.getElementById('btn-quit').onclick = function () {
    saveBehavior('quit').then(function () {
      if (TRAY.quitApp) TRAY.quitApp();
    });
  };
  document.getElementById('btn-tray').onclick = function () {
    saveBehavior('minimize').then(function () {
      if (TRAY.minimizeToTray) TRAY.minimizeToTray();
    });
  };
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && TRAY.cancelClose) TRAY.cancelClose();
  });
})();
</script>
</body>
</html>
