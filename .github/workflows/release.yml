name: Build & Release

# ============================================================
# 触发条件：仅在正式版本 tag 上触发
# ============================================================
# 排除迁移期 tag（AGENTS.md "Git 工作流"）：
#   - v*-pre-*    迁移里程碑前的回滚锚点
#   - v*-post-*   迁移完成后的事后标记
#   - v*dev*      开发期临时 tag
#   - v*-rc-*     Release Candidate（预发布）
# 这些 tag 只用作回滚锚点或预发布，不应该触发正式 Release 构建。
#
# GitHub Actions 用 glob（非正则）。先匹配 v* 再用 ! 排除迁移期 tag。
on:
  push:
    tags:
      - 'v*'
      - '!v*-pre-*'
      - '!v*-post-*'
      - '!v*dev*'
      - '!v*-rc-*'

permissions:
  contents: write  # 创建 Release + 上传资源

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # 同一 tag 多次 push 不取消，避免半成品 Release

jobs:
  # ============================================================
  # 清理 Release 旧资产
  # ============================================================
  # electron-builder --publish always 只覆盖同名资产，不删除旧文件。
  # 多次构建会导致 Release 累积大量旧产物（如改名后的 lumio-frontend-* vs lumio-*）。
  # 这个 job 在 build 之前先删除 Release 上所有现有资产，保证最终只有本次构建的产物。
  cleanup-release:
    name: Cleanup Release Assets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Delete all existing release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Cleaning assets for tag: $TAG"
          # 如果 Release 不存在（首次构建），gh release view 会失败，直接退出
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG does not exist yet, nothing to clean"
            exit 0
          fi
          # 列出所有资产并逐个删除
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | while read -r asset; do
            echo "Deleting: $asset"
            gh release delete-asset "$TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes || true
          done
          echo "Cleanup complete"

  # ============================================================
  # 构建：4 平台并行矩阵
  # ============================================================
  # - Windows x64    → NSIS 安装包（.exe）
  # - macOS x64      → DMG（Intel，macos-13 原生 runner）
  # - macOS arm64    → DMG（Apple Silicon，macos-14 原生 runner）
  # - Linux x64      → AppImage + deb + rpm
  #
  # 关键设计：
  #   1. macOS 不在 electron-builder.config.cjs 里指定 arch，让 CI 矩阵
  #      用原生 runner 架构分别构建。原因：PyInstaller 不支持交叉编译，
  #      Python 后端必须是原生架构。
  #   2. electron-builder --publish always 自动上传产物 + latest.yml 到 Release
  #      （electron-updater 通过 latest.yml 检查更新）
  #   3. GH_TOKEN 环境变量让 electron-builder 有权创建/编辑 Release
  #   4. macOS notarize 默认关闭；通过 secrets 启用（个人项目无 Apple 证书）
  #   5. Windows 代码签名默认关闭；通过 secrets CSC_LINK 启用
  build:
    name: Build (${{ matrix.os_name }})
    needs: cleanup-release  # 先清理旧资产，再上传新产物
    strategy:
      fail-fast: false  # 一个平台失败不影响其他平台继续跑
      matrix:
        include:
          - os: windows-latest
            os_name: windows-x64
            python_cmd: python
          - os: macos-14
            os_name: macos-arm64
            python_cmd: python3
          - os: ubuntu-latest
            os_name: linux-x64
            python_cmd: python3

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          ${{ matrix.python_cmd }} -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Install system ffmpeg (Unix)
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install ffmpeg
          else
            sudo apt-get update && sudo apt-get install -y ffmpeg libxtst6 libnss3 libnotify4
          fi
        shell: bash

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install macOS dmg-license (macOS only)
        if: runner.os == 'macOS'
        working-directory: frontend
        run: npm install --no-save dmg-license

      - name: Build Python backend (PyInstaller)
        working-directory: frontend
        run: npm run build:backend

      - name: Build frontend (Vite + TypeScript)
        working-directory: frontend
        run: npm run build

      - name: Build Electron main (TypeScript)
        working-directory: frontend
        run: npm run build:electron

      - name: Verify build inputs
        working-directory: frontend
        run: |
          echo "--- python-backend/ ---"
          ls -la python-backend/ | head -20
          echo "--- dist/ ---"
          ls -la dist/ | head -10
          echo "--- dist-electron/ ---"
          ls -la dist-electron/ | head -10
          echo "--- build/ ---"
          ls -la build/ | head -10
        shell: bash

      - name: Package with electron-builder (--publish always)
        working-directory: frontend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # 代码签名证书通过 shell 动态 export，空字符串会导致 electron-builder
          # 把 "" 当文件路径解析报 "not a file" 错误
          CSC_LINK_SECRET: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_SECRET: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          # 只在 secret 非空时 export，避免空字符串触发 electron-builder 报错
          if [ -n "$CSC_LINK_SECRET" ]; then
            export CSC_LINK="$CSC_LINK_SECRET"
            export CSC_KEY_PASSWORD="$CSC_KEY_PASSWORD_SECRET"
          fi
          # Linux 用命令行参数强制指定 target，避免 electron-builder 24.x 自动添加 snap
          # （命令行 --linux 优先级高于配置文件 linux.target）
          if [ "$RUNNER_OS" = "Linux" ]; then
            npx electron-builder --linux AppImage deb rpm --publish always
          else
            npx electron-builder --publish always
          fi
        shell: bash

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.os_name }}
          path: |
            frontend/release/
            frontend/dist/
            frontend/dist-electron/
            dist/
          retention-days: 7

  # ============================================================
  # 发布说明：所有平台构建完成后统一更新 Release body
  # ============================================================
  # electron-builder --publish always 会自动创建 Release（body 为空），
  # 这个 job 在所有 build job 完成后，从 git log 生成 release notes
  # 并写入 Release body。UpdateDialog 通过 GitHub API 读 body 显示更新内容。
  release-notes:
    name: Update Release Notes
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整 git history 用于生成 release notes

      - name: Generate release notes from commit history
        id: notes
        run: |
          # 找到上一个 tag（排除当前 tag）
          CURRENT_TAG=${GITHUB_REF#refs/tags/}
          echo "Current tag: $CURRENT_TAG"

          # 列出当前 tag 之前的所有 tag，按版本号排序取最新
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${CURRENT_TAG}$" | head -1 || echo "")
          echo "Previous tag: $PREV_TAG"

          if [ -n "$PREV_TAG" ]; then
            # 从上个 tag 到当前 tag 的 commit history
            NOTES=$(git log --pretty=format:"- %s" ${PREV_TAG}..${CURRENT_TAG} | head -80)
          else
            # 没有 prev tag，取最近 50 条 commit
            NOTES=$(git log --pretty=format:"- %s" HEAD~50..HEAD | head -50)
          fi

          # 写到 GITHUB_OUTPUT（prev_tag 单行，notes 多行用 EOF heredoc）
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Update Release body
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Lumio ${{ github.ref_name }}

            内容采集与素材管理桌面工具，通过分享链接下载 YouTube / Instagram / X / B站 / 抖音 / 快手 / 微博 / 小红书的图片和视频。

            ---

            ### 📥 普通用户下载（只需选一个）

            | 系统 | 文件 | 说明 |
            |------|------|------|
            | **Windows x64** | `Lumio-Setup-${{ github.ref_name }}.exe` | NSIS 安装包，双击安装 |
            | **macOS Apple Silicon** | `Lumio-${{ github.ref_name }}-arm64.dmg` | M1/M2/M3/M4 Mac（Intel Mac 暂不提供） |
            | **Linux x64** | `Lumio-${{ github.ref_name }}.AppImage` | AppImage，无需安装，`chmod +x` 后直接运行 |
            | **Linux x64** | `Lumio-${{ github.ref_name }}.x86_64.rpm` | Fedora / RHEL / openSUSE |
            | **Linux x64** | `Lumio-${{ github.ref_name }}.amd64.deb` | Debian / Ubuntu |

            > ⚠️ **不要下载** `latest.yml` / `latest-mac.yml` / `latest-linux.yml` / `*.blockmap` / `*-mac.zip` / `Source code *` —— 这些是自动更新机制和 GitHub 默认生成的辅助文件，不是安装包。

            > ℹ️ **从旧版本（lumio-frontend）升级**：此版本修正了安装路径为 `Lumio`，请先在「设置 → 应用」中卸载旧的 `lumio-frontend`，再安装新版本。用户数据（`~/.lumio/`）不会丢失。

            ---

            ### 📋 更新内容

            ${{ steps.notes.outputs.notes }}

            ---

            ### 💻 系统要求

            - **Windows**: Windows 10/11 x64
            - **macOS**: macOS 12+（仅 Apple Silicon，Intel Mac 暂不提供预编译包）
            - **Linux**: Ubuntu 20.04+ / Fedora 36+ / Debian 11+ x64

            ---

            ### 📦 安装说明

            1. 下载对应系统的安装包（见上方表格）
            2. **Windows**: 双击 `.exe` 安装
            3. **macOS**: 双击 `.dmg`，将 Lumio 拖入 Applications
            4. **Linux**: `chmod +x Lumio-*.AppImage && ./Lumio-*.AppImage`，或用包管理器安装 `.deb`/`.rpm`
            5. 首次启动会自动拉起内置 Python 后端（无需手动配置环境）

            > **Windows 用户**: 首次运行可能弹出 SmartScreen 警告，点击「更多信息」→「仍要运行」即可。本工具未购买代码签名证书，所有源码均开源可查。

            > **macOS 用户**: 首次打开 DMG 后右键 →「打开」绕过 Gatekeeper；或终端执行 `xattr -dr com.apple.quarantine /Applications/Lumio.app`。

            ---

            ### 🔄 自动更新

            已安装的用户可在「设置 → 关于」点击「检查更新」：
            - **Windows / Linux**: 检测到新版本后弹窗提示，确认后后台下载，完成后一键重启安装
            - **macOS**: 检测到新版本后跳转到 Release 页面手动下载 DMG（无 Apple Developer 证书，不支持自动更新）

            ---

            ### 🛠️ 从源码运行（开发者）

            ```bash
            git clone https://github.com/Roseannepark0211/Lumio.git
            cd Lumio
            pip install -e .
            # 启动 Python 后端
            python -m lumio.api_fastapi
            # 另开终端启动前端（需要 Node.js 20+）
            cd frontend
            npm ci
            npm run dev:electron
            ```

            ---
            **Full Changelog**: https://github.com/Roseannepark0211/Lumio/compare/${{ steps.notes.outputs.prev_tag }}...${{ github.ref_name }}
