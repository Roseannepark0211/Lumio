name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: Lumio-Windows.zip
            pack_cmd: Compress-Archive -Path dist/Lumio/* -DestinationPath
          - os: macos-latest
            artifact_name: Lumio-macOS.tar.gz
            pack_cmd: cd dist && tar czf ../
          - os: ubuntu-latest
            artifact_name: Lumio-Linux.tar.gz
            pack_cmd: cd dist && tar czf ../

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -e ".[test]"

    - name: Run tests
      env:
        PYTHONPATH: src
      run: python -m pytest tests/ -v

    - name: Build with PyInstaller
      run: pyinstaller lumio.spec

    - name: Package (Windows)
      if: runner.os == 'Windows'
      run: Compress-Archive -Path dist/Lumio/* -DestinationPath ${{ matrix.artifact_name }}

    - name: Package (macOS/Linux)
      if: runner.os != 'Windows'
      run: cd dist && tar czf ../${{ matrix.artifact_name }} Lumio/

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ matrix.artifact_name }}
