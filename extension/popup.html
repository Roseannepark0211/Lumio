<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 360px;
    font-family: -apple-system, "Segoe UI", sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    padding: 16px;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .header h1 {
    font-size: 18px;
    font-weight: 600;
  }
  .status-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    display: inline-block;
  }
  .status-dot.on { background: #4ADE80; }
  .status-dot.off { background: #FF6B6B; }
  .status-text {
    font-size: 12px;
    color: #888;
  }
  .btn {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    margin-bottom: 8px;
    transition: background 0.2s;
  }
  .btn-primary {
    background: #4A9EFF;
    color: white;
  }
  .btn-primary:hover { background: #3B8FEF; }
  .btn-primary:disabled {
    background: #444;
    color: #888;
    cursor: not-allowed;
  }
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 12px 0 6px;
    border-bottom: 1px solid #333;
    padding-bottom: 4px;
  }
  .section-title {
    font-size: 13px;
    color: #888;
  }
  .btn-clear {
    font-size: 11px;
    color: #888;
    background: none;
    border: none;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .btn-clear:hover { background: #333; color: #ccc; }
  .history-item {
    padding: 6px 0;
    border-bottom: 1px solid #222;
    font-size: 12px;
  }
  .history-item .title {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 260px;
    display: inline-block;
  }
  .history-item .time {
    color: #666;
    font-size: 11px;
    float: right;
  }
  .empty {
    color: #666;
    font-size: 12px;
    text-align: center;
    padding: 12px;
  }
  .msg {
    text-align: center;
    padding: 8px;
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 8px;
    display: none;
  }
  .msg.ok { background: #1a3a2a; color: #4ADE80; display: block; }
  .msg.err { background: #3a1a1a; color: #FF6B6B; display: block; }
</style>
</head>
<body>
  <div class="header">
    <h1>Lumio</h1>
    <div>
      <span class="status-dot off" id="statusDot"></span>
      <span class="status-text" id="statusText">未连接</span>
    </div>
  </div>

  <div class="msg" id="msg"></div>

  <button class="btn btn-primary" id="btnSend" disabled>发送当前页面到 Lumio</button>

  <div class="section-header">
    <span class="section-title">最近发送</span>
    <button class="btn-clear" id="btnClear">清除</button>
  </div>
  <div id="history"><div class="empty">暂无记录</div></div>

  <script src="popup.js"></script>
</body>
</html>
