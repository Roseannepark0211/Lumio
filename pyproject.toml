[project]
name = "lumio"
version = "3.1.1"
description = "Download videos/images from Instagram and YouTube via share links"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "yt-dlp>=2024.1.0",
    "instaloader>=4.10",
    "requests>=2.28",
    "imageio-ffmpeg>=0.4.9",
    "sqlalchemy>=2.0",
    "Pillow>=10.0",
    "python-telegram-bot>=20.0",
    "apify-client>=1.6.0",
    "flask>=3.0",
    # FastAPI 包装层（React + Electron 前端的后端 API）
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "websockets>=12.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
lumio = "lumio.main:main"
lumio-api = "lumio.api_fastapi:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
